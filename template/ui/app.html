<!doctype html><html><head><meta charset="utf-8"><title>Simulation.AI</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- The model page: Control Tower Simulation.AI's UI as is (its stylesheet, layout and components), filled with this
     model's own data. Only the name changes. -->
<link rel="stylesheet" href="/ct.css">
<style>.sig-toggle::after{content:""}</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body class="bg-ink-50 text-ink-900 text-[14px]">
<div class="flex min-h-screen">
  <aside class="w-64 shrink-0 bg-white border-r border-ink-200">
    <div class="px-5 py-4 border-b border-ink-200"><div id="brand" class="text-brand-600 font-bold text-[15px]">&nbsp;</div>
      <div id="sub" class="text-ink-400 text-[11px]">Simulation.AI</div></div>
    <nav id="nav" class="py-2"></nav>
  </aside>
  <main class="flex-1 min-w-0">
    <header id="hdr" class="bg-white border-b border-ink-200 px-8 py-4"><h1 class="text-[19px] font-semibold text-ink-900">&nbsp;</h1></header>
    <div id="content" class="p-6"></div>
  </main>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
const SLUG = (location.pathname.match(/^\/apps\/([a-z0-9-]+)/) || [])[1];
const TAB = new URLSearchParams(location.search).get("tab") || "baseline";
// CT's tabs, icons and subtitles (Control Tower Simulation.AI, gui_app/app.py)
const TABS_ALL = [["building", "Building Model"], ["baseline", "Baseline"], ["studio", "Scenario Studio"], ["optimize", "Optimize & ROI"],
              ["drivers", "Drivers & Forecast"], ["alerts", "Watchtower"], ["ask", "Ask Simulation.AI"]];
let TABS = TABS_ALL;   // a server may offer fewer tabs (app.tabs; a Level 2 project)
const SUBS = {building: "How this model was built: every step, what was found, and what was approved.", studio: "Set the drivers, run a what-if, and watch the KPIs and the process flow respond.",
              optimize: "The best action for a scenario and its ROI.", drivers: "What moves the KPIs, and the forward forecast.",
              alerts: "Watch the horizon, understand the causes, and get the recommended actions.", ask: ""};
const ICON = {building: '<path d="M3 21h18"/><path d="M5 21V8l7-5 7 5v13"/><path d="M9 21v-6h6v6"/>', baseline: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>',
  studio: '<circle cx="16" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/><path d="M4 6h10"/><path d="M18 6h2"/><path d="M4 12h3"/><path d="M11 12h9"/><path d="M4 18h11"/><path d="M19 18h1"/>',
  optimize: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/>',
  drivers: '<path d="M22 7 13.5 15.5 8.5 10.5 2 17"/><path d="M16 7h6v6"/>',
  alerts: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  ask: '<path d="M12 3l1.8 4.9L18.7 9.7l-4.9 1.8L12 16.4l-1.8-4.9L5.3 9.7l4.9-1.8z"/>'};
const icon = t => `<svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[t]}</svg>`;
// CT's components
function section(sid, title, body, badge = "", open = false) {
  const b = badge ? `<span class="ml-2 text-[9px] bg-ink-100 text-ink-500 px-2 py-0.5 rounded-full">${badge}</span>` : "";
  return `<div class="bg-white rounded-xl border border-ink-200 mb-3"><button type="button" onclick="toggleSec('${sid}')" class="w-full flex items-center px-4 py-3">`
    + `<span id="arr${sid}" class="text-ink-400 text-[11px] mr-2 w-3">${open ? "&#9662;" : "&#9656;"}</span>`
    + `<span class="text-[13px] font-semibold text-ink-800">${title}</span>${b}</button>`
    + `<div id="sec${sid}" class="px-4 pb-4 ${open ? "" : "hidden"}">${body}</div></div>`;
}
const ON_OPEN = {};
function toggleSec(id) {
  const el = $("sec" + id), ar = $("arr" + id); if (!el) return;
  const h = el.classList.toggle("hidden"); if (ar) ar.innerHTML = h ? "&#9656;" : "&#9662;";
  if (!h && ON_OPEN[id]) ON_OPEN[id]();
}
const pill = t => `<span class="bg-brand-50 text-brand-700 border border-brand-200 text-[9px] font-semibold px-2 py-0.5 rounded-full">${t}</span>`;
function kpiBlock(title, value, delta, desc, subs, pills = "", accent = "#3366ff") {
  const box = ([l, v, p]) => `<div class="bg-brand-50/60 border border-brand-100 rounded px-1.5 py-1 text-center">`
    + `<div class="text-[8px] text-ink-500 leading-none mb-0.5">${l}</div><div class="text-[13px] font-bold text-ink-900 leading-none">${v}</div>`
    + (p ? `<div class="text-[7.5px] text-ink-400 leading-none mt-0.5">prior ${p}</div>` : "") + `</div>`;
  return `<div class="bg-white rounded-xl border border-ink-200 px-4 py-2.5 mb-2.5" style="border-left:4px solid ${accent}">`
    + `<div class="flex items-center justify-between mb-1"><h3 class="text-[11px] font-semibold text-ink-700 uppercase tracking-wide">${title}</h3>`
    + `<div class="flex gap-1.5 items-center">${pills}</div></div><div class="flex gap-4 items-center">`
    + `<div class="w-[120px] shrink-0"><div class="text-[26px] font-bold text-ink-900 leading-none">${value}</div><div class="text-[10px] mt-0.5">${delta}</div></div>`
    + `<div class="w-[240px] shrink-0 text-[9.5px] text-ink-400 leading-tight border-l border-ink-100 pl-4">${desc}</div>`
    + (subs.length ? `<div class="flex-1 grid grid-cols-5 gap-1.5">${subs.map(box).join("")}</div>` : "") + `</div></div>`;
}
function delta(d, unit, goodLow, tail) {
  const good = goodLow ? d <= 0 : d >= 0;
  return `<span class="text-status-${good ? "ok" : "danger"} font-medium">${d < 0 ? "&#9660;" : "&#9650;"} ${d >= 0 ? "+" : "-"}${fmt(Math.abs(d))}${unit === "%" ? "pp" : unit ? " " + esc(unit) : ""}${tail}</span>`;
}
const panel = (title, cid, span = 1, h = 150, note = "") => `<div class="bg-white rounded-xl border border-ink-200 p-4 col-span-${span}">`
  + `<h3 class="text-[11.5px] font-semibold text-ink-700">${title}</h3>${note ? `<p class="text-ink-400 text-[9.5px] mb-1">${note}</p>` : ""}`
  + `<div style="height:${h}px"><canvas id="${cid}"></canvas></div></div>`;
const fmt = v => v === null || v === undefined || isNaN(v) ? "—" : Math.abs(v) >= 1000 ? Math.round(v).toLocaleString() : (+v).toFixed(Math.abs(v) >= 100 ? 0 : 1);
const PAL = ["#3366ff", "#16a34a", "#d97706", "#db2777", "#0891b2", "#7c3aed", "#1836e1", "#64738c"];
if (window.Chart) {                // CT's chart defaults
  Chart.defaults.font.family = "ui-sans-serif,system-ui,sans-serif"; Chart.defaults.font.size = 10; Chart.defaults.color = "#64738c";
  Chart.defaults.plugins.legend.labels.boxWidth = 9; Chart.defaults.plugins.legend.labels.font = {size: 9};
  Chart.defaults.plugins.tooltip.backgroundColor = "#1f2532"; Chart.defaults.plugins.tooltip.padding = 8;
  Chart.defaults.plugins.tooltip.cornerRadius = 6; Chart.defaults.maintainAspectRatio = false;
}
const axis = (x, y) => ({x: {title: {display: true, text: x, font: {size: 9}, color: "#94a3b8"}, ticks: {font: {size: 8}, maxTicksLimit: 12}},
                         y: {title: {display: true, text: y, font: {size: 9}, color: "#94a3b8"}, ticks: {font: {size: 9}}}});
const CHARTS = {};
function chart(id, cfg) { const el = $(id); if (!el || !window.Chart) return; if (CHARTS[id]) CHARTS[id].destroy();
  CHARTS[id] = new Chart(el, {...cfg, options: {interaction: {mode: "index", intersect: false}, ...(cfg.options || {})}}); }
// CT's shared plain-English panel: it always says who wrote the sentence — the model, or one of our own rules
function narrPanel(id, state, txt, meta) {
  const el = $(id); if (!el) return;
  if (state === "loading") { el.innerHTML = '<div class="rounded-xl border border-ink-200 bg-white p-4"><div class="flex items-center gap-2"><span class="text-[13px] font-semibold text-ink-800">Reading the numbers</span><span class="text-[10px] text-ink-400">interpreting&hellip;</span></div><div class="mt-2 space-y-1.5"><div class="h-2 bg-ink-100 rounded animate-pulse"></div><div class="h-2 bg-ink-100 rounded animate-pulse w-5/6"></div></div></div>'; return; }
  meta = meta || {};
  const tag = meta.source === "model" ? '<span class="text-[9px] px-1.5 py-0.5 rounded-full border bg-brand-50 text-brand-700 border-brand-200">interpreted</span>'
    : '<span class="text-[9px] px-1.5 py-0.5 rounded-full border bg-ink-50 text-ink-500 border-ink-200">standard reading</span>';
  el.innerHTML = '<div class="rounded-xl border border-ink-200 border-l-4 border-l-brand-400 bg-white p-4"><div class="flex items-center gap-2 mb-1"><h4 class="text-[13px] font-semibold text-ink-800">'
    + (meta.heading || "What this means") + "</h4>" + tag + '</div><p class="text-[12.5px] text-ink-700 leading-relaxed">' + esc(txt) + '</p><p class="text-[10px] text-ink-400 mt-2">'
    + (meta.footnote || "Every figure above comes from the simulation. This paragraph only explains them &mdash; it does not recalculate anything.") + "</p></div>";
}
function askNarration(id, kind, payload, fallback, meta) {
  narrPanel(id, "loading");
  fetch(`/api/apps/${SLUG}/narrate`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({kind, payload, fallback})})
    .then(r => r.json()).then(r => narrPanel(id, "done", r.text || fallback, Object.assign({}, meta, r)))
    .catch(() => narrPanel(id, "done", fallback, Object.assign({source: "fallback"}, meta)));
}
function signOut() { fetch("/api/logout", {method: "POST", body: "{}"}).then(() => { location.href = "/"; }); }
async function api(p) { const r = await fetch(p); if (r.status === 401) { location.href = "/"; return null; }   // sign in on the landing page
  const d = await r.json(); if (!r.ok) throw new Error(d.error || r.status); return d; }

let APP = null, UC = null, BL = null;
function chrome() {
  $("brand").textContent = APP ? APP.title : "Simulation.AI";
  $("sub").textContent = `Simulation.AI · version ${APP ? APP.live : ""}`;
  document.title = `${APP ? APP.title + " " : ""}Simulation.AI`;
  $("nav").innerHTML = TABS.map(([t, n]) => `<a href="/apps/${SLUG}?tab=${t}" class="flex items-center gap-2.5 px-5 py-2 text-[13px] ${t === TAB
    ? "bg-brand-50 text-brand-700 border-l-4 border-brand-500" : "text-ink-600 border-l-4 border-transparent hover:bg-ink-50"}">${icon(t)}<span>${n}</span></a>`).join("")
    + `<div class="mt-4 mx-5 pt-3 border-t border-ink-100">${ME && ME.user ? `<p class="text-[11px] text-ink-500 mb-1 truncate">&#128100; ${esc(ME.user)}</p>` : ""}`
    + (APP && APP.project ? "" : `<a href="/apps/${SLUG}?tab=review" class="block text-[11.5px] text-brand-700 hover:underline mb-1">&#128203; Review log</a>`
    + `<a href="/" class="block text-[11.5px] text-brand-700 hover:underline mb-1">&#8592; All simulation models</a>`
    + (ME && ME.user ? `<button onclick="signOut()" class="text-[11.5px] text-ink-500 hover:text-brand-700 hover:underline">Sign out</button>` : "")) + `</div>`;
  const name = TAB === "review" ? "Review log" : (TABS.find(x => x[0] === TAB) || TABS[0])[1];
  $("hdr").innerHTML = TAB === "ask" ? `<h1 class="text-[19px] font-semibold text-ink-900">&nbsp;</h1>`
    : `<h1 class="text-[19px] font-semibold text-ink-900">${name}</h1><p class="text-ink-400 text-[12px]">${TAB === "baseline" && BL
      ? `Current status of the business — the objective KPIs, by period or ${esc(BL.group_column || "group")}. Horizon: ${BL.forecast.periods.length} ${esc(BL.time_unit)}s.`
      : esc(SUBS[TAB] || "")}</p>`;
}

// ---------- Baseline: Baseline — Current Status, Historical Review ----------
const label = k => { const t = String(k ?? "").replace(/_/g, " "); return esc(t.charAt(0).toUpperCase() + t.slice(1)); };
let GRP = "", PER = "all";
function baselineView() {
  const B = BL, H = B.history, F = B.forecast, n = H.periods.length;
  const gopts = `<option value="">All ${label(B.group_column || "groups")} (portfolio)</option>` + H.groups.map(g => `<option value="${esc(g)}" ${g === GRP ? "selected" : ""}>${esc(g)}</option>`).join("");
  const popts = `<option value="all">All periods (average)</option>` + F.periods.map(p => `<option value="${p}" ${p === PER ? "selected" : ""}>${p}</option>`).join("");
  const controls = `<div class="flex flex-wrap items-end gap-4 mb-4"><div><label class="text-[10px] text-ink-500 block mb-1">${label(B.group_column || "Group")} view</label>`
    + `<select id="grpsel" onchange="GRP=this.value;drawBaseline()" class="border border-ink-300 rounded-md px-3 py-1.5 text-[13px] bg-white w-72">${gopts}</select></div>`
    + `<div><label class="text-[10px] text-ink-500 block mb-1">${label(B.time_unit)}</label>`
    + `<select id="persel" onchange="PER=this.value;drawBaseline()" class="border border-ink-300 rounded-md px-2 py-1.5 text-[13px] bg-white">${popts}</select></div></div>`;
  const pi = PER === "all" ? null : F.periods.indexOf(PER);
  const blocks = B.kpis.map((k, i) => {
    const f = F.kpis[k.name], avg = a => a.reduce((s, v) => s + v, 0) / a.length;
    const val = GRP ? (H.by_group[k.name][GRP] || [])[n - 1] : pi === null ? avg(f.p50) : f.p50[pi];
    const lo = pi === null ? avg(f.p10) : f.p10[pi], hi = pi === null ? avg(f.p90) : f.p90[pi];
    const last = GRP ? (H.by_group[k.name][GRP] || [])[n - 2] : H.kpis[k.name][n - 1];
    const u = k.unit === "%" ? "%" : "";
    const value = `${fmt(val)}${u}` + (GRP ? "" : `<span class="text-[10px] font-normal text-ink-400 ml-1">(${fmt(lo)}–${fmt(hi)})</span>`);
    const d = val - last, tail = GRP ? " vs prior period" : " vs last actual";
    const subs = H.groups.slice(0, 5).map(g => [esc(g), fmt((H.by_group[k.name][g] || [])[n - 1]) + u, fmt((H.by_group[k.name][g] || [])[n - 2]) + u]);
    const desc = `${label(k.name)} = ${esc(k.formula)}. ${k.better === "lower" ? "Lower is better." : k.better === "higher" ? "Higher is better." : ""} `
      + (GRP ? `Latest actual for ${esc(GRP)} (${H.periods[n - 1]}).` : `Forecast ${pi === null ? "average over the horizon" : "for " + PER}; P10–P90 in brackets.`);
    return kpiBlock(label(k.name), value, delta(d, k.unit, k.better === "lower", tail), desc, subs,
                    k.target !== null && k.target !== undefined ? pill(`Target ${k.better === "lower" ? "&lt;" : "&gt;"} ${esc(k.target)}${u}`) : "",
                    ["#1c2e8f", "#1836e1", "#3366ff", "#0891b2"][i % 4]);
  }).join("");
  const charts = `<div class="grid grid-cols-4 gap-4">` + B.kpis.map((k, i) =>
      panel(`${label(k.name)} — trend`, `cTrend${i}`, 2, 150, `history${GRP ? " · " + esc(GRP) : ""} and forecast · shaded = P10–P90`)
      + panel(`${label(k.name)} by ${label(B.group_column || "group")}`, `cGrp${i}`, 2, 150, `latest actual (${H.periods[n - 1]}) vs prior`)).join("")
    + `</div><div class="mt-4">` + panel("The data behind the KPIs", "cCols", 1, 170, `per ${esc(B.time_unit)} · the columns in the KPI formulas and the levers`) + `</div>`;
  return section("bl", "Baseline — Current Status", controls + blocks + charts, `${F.periods.length}-${esc(B.time_unit)} forward`, true)
    + section("hist", "Historical Review", histView(), "our own actuals", false);
}
function histView() {
  const H = BL.history;
  const trend = `<div class="grid grid-cols-3 gap-3">` + Object.keys(H.columns).map((c, i) =>
    `<div><p class="text-[11px] font-medium text-ink-700 mb-1">${label(c)}</p><div style="height:180px"><canvas id="ht${i}"></canvas></div></div>`).join("") + `</div>`;
  const snap = `<div class="flex items-center gap-2 mb-3"><label class="text-[11px] text-ink-600 font-medium">${label(BL.time_unit)}</label>`
    + `<select id="histWk" onchange="drawSnap()" class="border border-ink-300 rounded px-2 py-1 text-[12px]">${H.periods.map(p => `<option ${p === H.periods[H.periods.length - 1] ? "selected" : ""}>${p}</option>`).join("")}</select>`
    + `<span class="text-[10px] text-ink-400">pick any ${esc(BL.time_unit)} to see its actuals</span></div>`
    + `<div id="histTiles" class="grid grid-cols-4 gap-2 mb-4"></div><div class="grid grid-cols-3 gap-3" id="histBars"></div>`;
  const note = `<p class="text-[11px] text-ink-500 mb-3">Each KPI and the columns behind it, per ${esc(BL.time_unit)}, from your own data (${H.periods[0]} to ${H.periods[H.periods.length - 1]}). Pick a ${esc(BL.time_unit)} below to see that ${esc(BL.time_unit)} by ${label(BL.group_column || "group")}.</p>`;
  return note + section("htrend", "Trend over time", trend, "", false) + section("hsnap", "Snapshot", snap, "", false);
}
function drawBaseline() {
  $("content").innerHTML = baselineView();
  const B = BL, H = B.history, F = B.forecast, n = H.periods.length, tail = Math.max(0, n - 24);
  B.kpis.forEach((k, i) => {
    const hs = (GRP ? H.by_group[k.name][GRP] : H.kpis[k.name]).slice(tail), L = H.periods.slice(tail).concat(F.periods);
    const pad = a => Array(hs.length).fill(null).concat(a), f = F.kpis[k.name];
    const ds = [{label: "Actual", data: hs.concat(Array(F.periods.length).fill(null)), borderColor: "#1c2e8f", borderWidth: 2, pointRadius: 0, tension: .25}];
    if (!GRP) ds.push({label: "P90", data: pad(f.p90), borderColor: "transparent", backgroundColor: "rgba(51,102,255,.12)", pointRadius: 0, fill: "+1"},
                      {label: "P10", data: pad(f.p10), borderColor: "transparent", pointRadius: 0, fill: false},
                      {label: "Forecast (P50)", data: pad(f.p50), borderColor: "#3366ff", borderDash: [5, 4], borderWidth: 2, pointRadius: 0});
    if (k.target !== null && k.target !== undefined) ds.push({label: "Target", data: L.map(() => +k.target), borderColor: "#dc2626", borderDash: [3, 3], borderWidth: 1, pointRadius: 0});
    chart(`cTrend${i}`, {type: "line", data: {labels: L, datasets: ds}, options: {plugins: {legend: {labels: {filter: x => !/^P(10|90)$/.test(x.text)}}}, scales: axis(B.time_unit, label(k.unit || k.name))}});
    chart(`cGrp${i}`, {type: "bar", data: {labels: H.groups, datasets: [
      {label: H.periods[n - 1], data: H.groups.map(g => (H.by_group[k.name][g] || [])[n - 1]), backgroundColor: "#3366ff"},
      {label: H.periods[n - 2] || "prior", data: H.groups.map(g => (H.by_group[k.name][g] || [])[n - 2]), backgroundColor: "#c7d2fe"}]},
      options: {scales: axis(label(B.group_column || "group"), label(k.unit || k.name))}});
  });
  chart("cCols", {type: "line", data: {labels: H.periods.slice(tail), datasets: Object.entries(H.columns).map(([c, v], i) => ({label: label(c), data: v.slice(tail),
    borderColor: PAL[i % PAL.length], borderWidth: 1.6, pointRadius: 0, tension: .25, yAxisID: i ? "y1" : "y"}))},
    options: {scales: {...axis(B.time_unit, ""), y1: {position: "right", grid: {drawOnChartArea: false}, ticks: {font: {size: 9}}}}}});
  ON_OPEN.htrend = drawTrend; ON_OPEN.hsnap = drawSnap;
}
function drawTrend() {
  const H = BL.history;
  Object.entries(H.columns).forEach(([c, v], i) => chart(`ht${i}`, {type: "line", data: {labels: H.periods, datasets: [{label: label(c), data: v,
    borderColor: PAL[i % PAL.length], borderWidth: 1.6, pointRadius: 0, tension: .25, fill: false}]}, options: {plugins: {legend: {display: false}}, scales: axis(BL.time_unit, label(c))}}));
}
function drawSnap() {
  const H = BL.history, p = $("histWk").value, j = H.periods.indexOf(p);
  $("histTiles").innerHTML = BL.kpis.map(k => `<div class="bg-white rounded-lg border border-ink-200 px-3 py-2"><div class="text-[9.5px] text-ink-400 uppercase tracking-wide">${label(k.name)}</div>`
    + `<div class="text-[18px] font-bold text-ink-900">${fmt(H.kpis[k.name][j])}${k.unit === "%" ? "%" : ""}</div></div>`).join("")
    + Object.entries(H.columns).slice(0, 4 - BL.kpis.length % 4 || 4).map(([c, v]) => `<div class="bg-white rounded-lg border border-ink-200 px-3 py-2"><div class="text-[9.5px] text-ink-400 uppercase tracking-wide">${label(c)}</div>`
    + `<div class="text-[18px] font-bold text-ink-900">${fmt(v[j])}</div></div>`).join("");
  $("histBars").innerHTML = BL.kpis.map((k, i) => `<div><p class="text-[11px] font-medium text-ink-700 mb-1">${label(k.name)} by ${label(BL.group_column || "group")}</p><div style="height:180px"><canvas id="hs${i}"></canvas></div></div>`).join("");
  BL.kpis.forEach((k, i) => chart(`hs${i}`, {type: "bar", data: {labels: H.groups, datasets: [{label: p, data: H.groups.map(g => (H.by_group[k.name][g] || [])[j]),
    backgroundColor: H.groups.map((_, x) => PAL[x % PAL.length])}]}, options: {plugins: {legend: {display: false}}, scales: axis(label(BL.group_column || "group"), label(k.unit || k.name))}}));
}


// ---------- Scenario Studio (CT's top panel + Scenario Impact, Flow Response, Where to Intervene, Compare) ----------
let ST = null, SET = {}, LAST = null, LEDGER = [], WB = null, LIVE_T = null;
